  <form class="uy-form" data-form="kayit" novalidate>
    <p class="uy-b">Ücretsiz üye ol</p>
    <p class="dv-geldi" data-davet-geldi hidden>🎁 Bir arkadaşının davetiyle geldin. Üye ol, 7 gün Premium'u ücretsiz dene.</p>
    <label>Ad soyad<input name="ad_soyad" autocomplete="name" maxlength="120" required></label>
    <label>E-posta<input name="eposta" type="email" autocomplete="email" required></label>
    <label>Cep telefonu <small>(isteğe bağlı)</small><input name="telefon" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="05xx xxx xx xx"></label>
    <label>Şifre<input name="sifre" type="password" autocomplete="new-password" minlength="8" required><small>En az 8 karakter</small></label>
    <label class="uy-onay"><input type="checkbox" name="kvkk" required><span><a href="/hakkimizda/kisisel-verileri-koruma/" target="_blank" rel="noopener">Kişisel Verileri Koruma aydınlatma metnini</a> okudum.</span></label>
    <label class="uy-onay"><input type="checkbox" name="sartlar" required><span><a href="/hakkimizda/kullanim-sartlari/" target="_blank" rel="noopener">Kullanım Şartları</a>'nı kabul ediyorum, 18 yaşından büyüğüm.</span></label>
    <label class="uy-onay"><input type="checkbox" name="ileti"><span>Yeni analiz ve kampanyalardan e-posta ve SMS ile haberdar olmak istiyorum. <small>(İsteğe bağlı, istediğin zaman vazgeçebilirsin.)</small></span></label>
    <button class="dugme dugme-mavi" type="submit">Üye ol</button>
    <p class="uy-mesaj" role="status" aria-live="polite"></p>
  </form>
  <form class="uy-form" data-form="giris" novalidate hidden>
    <p class="uy-b">Giriş yap</p>
    <label>E-posta<input name="eposta" type="email" autocomplete="email" required></label>
    <label>Şifre<input name="sifre" type="password" autocomplete="current-password" required></label>
    <label class="uy-hatirla"><input name="hatirla" type="checkbox" value="1"><span>Kullanıcı adımı (e-postamı) hatırla</span></label>
    <button class="dugme dugme-mavi" type="submit">Giriş yap</button>
    <button type="button" class="uy-link" data-sifre-unuttum>Şifremi unuttum</button>
    <p class="uy-mesaj" role="status" aria-live="polite"></p>
  </form>
  <form class="uy-form" data-form="yeni-sifre" novalidate hidden>
    <p class="uy-b">Yeni şifre belirle</p>
    <label>Yeni şifre<input name="sifre" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="dugme dugme-mavi" type="submit">Şifreyi kaydet</button>
    <p class="uy-mesaj" role="status" aria-live="polite"></p>
  </form>
